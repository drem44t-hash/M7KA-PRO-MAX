<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>عشيرة تيم</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="world"></canvas>
  <canvas id="minimap"></canvas>

  <!-- الشريط العلوي -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>عشيرة <em>تيم</em></h1>
    </div>
    <div class="topbar-stats" id="topbarStats">
      <div class="stat">
        <span class="stat-label">بوتات الخريطة</span>
        <span class="stat-value" id="statTotal">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">متابعين الحساب</span>
        <span class="stat-value" id="statFollowers">—</span>
      </div>
    </div>
    <div class="conn-badge" id="connBadge">
      <span class="dot"></span>
      <span id="connText">غير متصل</span>
    </div>
  </header>

  <!-- لوحة القبائل يمين -->
  <aside class="tribes-panel" id="tribesPanel"></aside>

  <!-- شاشة البداية / الاتصال -->
  <section class="intro" id="intro">
    <div class="intro-card">
      <div class="intro-glow"></div>
      <h2>عشيرة تيم</h2>
      <p>نراقب عدد متابعين حسابك على تيك توك كل 5 دقايق، وأي زيادة بالعدد تطلّع بوت جديد بالخريطة.</p>

      <label class="field">
        <span>يوزر تيك توك (بدون @)</span>
        <input type="text" id="usernameInput" placeholder="azex0110" autocomplete="off" />
      </label>

      <div class="intro-actions">
        <button class="btn btn-primary" id="connectBtn">ابدأ التتبع</button>
        <button class="btn btn-ghost" id="demoBtn">جرّب وضع المحاكاة</button>
      </div>
      <p class="intro-note">وضع المحاكاة يولّد متابعين وهميين فورًا، عشان تختبر الخريطة قبل ما تربطها بحسابك.</p>
    </div>
  </section>

  <!-- أدوات التحكم أسفل يسار -->
  <footer class="controls">
    <button class="ctrl-btn" id="zoomInBtn" title="تكبير">＋</button>
    <button class="ctrl-btn" id="zoomOutBtn" title="تصغير">－</button>
    <button class="ctrl-btn" id="recenterBtn" title="توسيط">◎</button>
    <button class="ctrl-btn ctrl-btn-wide" id="simulateBtn" title="أضف متابع وهمي">+ متابع تجريبي</button>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
